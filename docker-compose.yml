services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - auraplay_data:/data
    env_file:
      - .env
    command: flask run --host=0.0.0.0

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true # Enables file watching in Docker for live-reloading
      - REACT_APP_API_URL=http://localhost:5000/api

volumes:
  auraplay_data:
